{% extends 'core/base.html' %}
{% block content %}
<header>
    <div class="page-title">
        <h2>System Settings</h2>
        <p>Configure hospital operational parameters and global software preferences.</p>
    </div>
    <button class="btn btn-primary" onclick="executeSystemSaveSequence()">
        <i data-lucide="save"></i> Save Changes
    </button>
</header>

<div class="card" style="max-width: 700px;">
    <h3 style="margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">General Configuration</h3>
    
    <div style="display: flex; flex-direction: column; gap: 20px;">
        <div>
            <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px;">Hospital/Clinic Name</label>
            <input type="text" id="settingClinicName" value="MediCare Pro Hospital" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); outline: none;">
        </div>
        
        <div>
            <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px;">Support Email Contact</label>
            <input type="email" id="settingClinicEmail" value="admin@medicarepro.com" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); outline: none;">
        </div>

        <div>
            <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px;">System Currency Setup</label>
            <select id="settingCurrency" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); outline: none; background: white;">
                <option selected>USD ($)</option>
                <option>EUR (€)</option>
                <option>GBP (£)</option>
                <option>INR (₹)</option>
            </select>
        </div>
        
        <div style="display: flex; align-items: center; gap: 12px; margin-top: 12px;">
            <input type="checkbox" id="maintenanceCheckbox" style="width: 18px; height: 18px; cursor: pointer;">
            <label for="maintenanceCheckbox" style="font-weight: 600; font-size: 0.9rem; color: #b91c1c; cursor: pointer; user-select: none;">
                Enable Maintenance Mode (Locks out standard users)
            </label>
        </div>
    </div>
</div>

<script>
    function executeSystemSaveSequence() {
        const clinicName = document.getElementById('settingClinicName').value.trim();
        const maintenanceActive = document.getElementById('maintenanceCheckbox').checked;

        if (!clinicName) {
            alert('Hospital/Clinic Name cannot be empty.');
            return;
        }

        if (maintenanceActive) {
            // 1. Alert the user that they are entering maintenance mode and will be kicked out
            showToast('CRITICAL: Maintenance mode enabled. Locking portal and logging out...', 'alert-triangle');
            
            // 2. Wait 1.5 seconds for the toast notification to show, then force a logout route redirection
            setTimeout(() => {
                window.location.href = "{% url 'logout' %}";
            }, 1500);
            
        } else {
            // Standard save notification if checkbox is empty
            showToast('Updating system configurations...', 'loader');
            setTimeout(() => {
                showToast(`Configurations for ${clinicName} saved securely.`, 'check-circle');
            }, 800);
        }
    }
</script>
{% endblock %}
