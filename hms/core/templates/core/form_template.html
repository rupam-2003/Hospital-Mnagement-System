{% extends 'core/base.html' %}
{% block content %}
<header>
    <div class="page-title">
        <h2>{{ title }}</h2>
        <p>Please enter valid details into the registry system infrastructure.</p>
    </div>
</header>
<div class="card" style="max-width: 600px;">
    <form method="POST" style="display: flex; flex-direction: column; gap: 16px;">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="margin-top: 12px; display: flex; gap: 12px;">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="javascript:history.back()" class="btn" style="background:#cbd5e1; color:var(--text-main); text-decoration:none;">Cancel</a>
        </div>
    </form>
</div>
<style>
    form p { display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; font-weight: 500; margin-bottom: 12px; }
    form input, form select, form textarea { padding: 10px; border: 1px solid var(--border-color); border-radius: var(--radius-md); outline: none; }
    form input:focus { border-color: var(--primary); }
</style>
{% endblock %}
